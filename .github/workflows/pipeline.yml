name: DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  REPOSITORY: devops-repo
  IMAGE: devops-service
  TAG: ${{ github.sha }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Lint (Ruff & Black)
      run: make lint
      
    - name: Unit Tests
      env:
        API_KEY: "2f5ae96c-b558-4c7b-a590-a501ae1c3f6c"
      run: make test

  security-scan:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Bandit
      run: pip install bandit
      
    - name: Code Security Scan (Bandit)
      run: bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true # Report only for assessment purposes
      
    - name: Upload Bandit Report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json

  build-push:
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    
    # Authenticate to Google Cloud (Simulation)
    # - id: auth
    #   uses: google-github-actions/auth@v2
    #   with:
    #     workload_identity_provider: ...
    
    - name: Build Docker Image
      run: |
        docker build -t $IMAGE:$TAG .
        
    - name: Image Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.IMAGE }}:${{ env.TAG }}'
        format: 'table'
        exit-code: '0' # Don't fail pipeline for now
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    # - name: Push to GAR
    #   run: |
    #     docker tag $IMAGE:$TAG $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$TAG
    #     docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$TAG

  deploy-sim:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.11.1

    - name: Helm Template (Simulation)
      run: |
        helm template devops-assessment ./chart \
          --set image.tag=$TAG \
          --namespace default
